<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense Lite</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            margin-top: 20px;
        }
        canvas {
            background-color: #ecf0f1;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        .ui-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <div>💰 Budget: <span id="money">100</span></div>
        <div>❤️ Health: <span id="health">10</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Variables
        let money = 100;
        let baseHealth = 10;
        let frameCount = 0;

        // Path waypoints for enemies
        const path = [
            { x: 0, y: 150 },
            { x: 300, y: 150 },
            { x: 300, y: 450 },
            { x: 600, y: 450 },
            { x: 600, y: 100 },
            { x: 800, y: 100 }
        ];

        // Draw the enemy path
        function drawPath() {
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.lineWidth = 40;
            ctx.strokeStyle = '#bdc3c7'; // Light grey path
            ctx.stroke();
        }

        // Main Game Loop
        function animate() {
            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw game elements
            drawPath();

            // Example Base Box at the end of the path
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(750, 60, 50, 80);

            frameCount++;
            requestAnimationFrame(animate);
        }

        // Mouse click listener for placing towers later
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            
            console.log(`Bhai, tune click kiya yahan: X=${mouseX}, Y=${mouseY}`);
            // Logic for buying and placing tower will go here
        });

        // Start Game
        animate();
    </script>
</body>
</html>
